jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: touch file-to-upload

      - id: artifact-upload
        uses: actions/upload-artifact@v7
        with:
          path: file-to-upload
          archive: false
          if-no-files-found: ignore

      - env:
          BLAH: ${{ toJson(steps.artifact-upload) }}
        run: |
          echo "$BLAH" | jq

      - if: ${{ !steps.artifact-upload.outputs }}
        run: |
          echo HELO
