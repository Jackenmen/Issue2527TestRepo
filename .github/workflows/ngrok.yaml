name: Host SSH session.
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: 'OS to run on.'
        type: choice
        options:
          # Ubuntu
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-slim
          # macoOS
          - macos-15-intel
          - macos-latest
          - macos-15
          - macos-14
          # Windows
          - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
        default: ubuntu-latest

jobs:
  ngrok:
    environment: Ngrok
    runs-on: "${{ github.event.inputs.runs-on }}"
    steps:
      - uses: actions/checkout@v2
      - name: Start SSH session
        uses: luchihoratiu/debug-via-ssh@v1.2
        with:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
