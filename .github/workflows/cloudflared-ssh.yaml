name: Host cloudflared SSH session.
run-name: "Host cloudflared SSH session (${{ github.event.inputs.runs-on }})"
on:
  workflow_dispatch:
    inputs:
      runs-on:
        description: 'OS to run on.'
        type: choice
        options:
          # Ubuntu
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-slim
          # macoOS
          - macos-26
          - macos-26-intel
          - macos-15-intel
          - macos-latest
          - macos-15
          - macos-14
          # Windows
          - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
        default: ubuntu-latest

jobs:
  ngrok:
    runs-on: "${{ github.event.inputs.runs-on }}"
    steps:
      - uses: valeriangalliat/action-sshd-cloudflared@f231ff81b1a41b9dc7c3aab65e4a1b08d952f068
        env:
          AUTHORIZED_KEYS: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHnt+ijCmcge6BonN+P/5wHayRPwwm9UD7fRzJcQwOiT ubuntu
